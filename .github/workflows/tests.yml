name: Tests

on:
  push:
    branches: [live_master, test, staging]
  pull_request:
    branches: [live_master]

jobs:
  tests:
    name: PHPUnit (PHP 8.4 / MariaDB 11)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: cutera_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_TEST_HOST: 127.0.0.1
      DB_TEST_PORT: 3306
      DB_TEST_DATABASE: cutera_test
      DB_TEST_USERNAME: root
      DB_TEST_PASSWORD: password

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, xml, ctype, json, bcmath, gd, zip
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Wait for MariaDB to be ready
        run: |
          for i in $(seq 1 30); do
            mariadb-admin ping -h 127.0.0.1 -u root -ppassword --silent && break
            echo "Waiting for MariaDB... ($i/30)"
            sleep 2
          done

      - name: Load test database schema
        run: |
          mariadb -h 127.0.0.1 -u root -ppassword cutera_test < database/schema/mariadb_testing-schema.sql

      - name: Run migrations on test database
        run: php artisan migrate --database=mariadb_testing --force

      - name: Run tests
        run: php artisan test --colors=always
