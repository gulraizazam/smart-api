# bitbucket-pipelines.yml — Cutera crm3 (Laravel 12 + SPA). One repo, multi-branch deploy.
# Bitbucket runs ONLY the section matching the pushed branch. Keep this file identical on
# every branch — it propagates via your production->crm2 and backend->api merges.

image: php:8.4-cli

definitions:
  caches:
    composer: ~/.composer/cache
  services:
    mariadb:
      image: mariadb:11
      variables:
        MARIADB_ROOT_PASSWORD: password
        MARIADB_DATABASE: cutera_test

  steps:
    # ---------- CI gate: mirrors .github/workflows/tests.yml ----------
    - step: &ci
        name: CI - Pest (PHP 8.4 / MariaDB 11)
        caches: [composer]
        services: [mariadb]
        script:
          - apt-get update && apt-get install -y --no-install-recommends git unzip libzip-dev libpng-dev libonig-dev default-mysql-client > /dev/null
          - docker-php-ext-install pdo_mysql zip gd bcmath > /dev/null
          - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          - composer install --no-interaction --prefer-dist --no-progress
          # No .env.example on these branches -> generate a minimal CI .env (no secrets;
          # phpunit.xml forces DB_CONNECTION=mariadb_testing + QUEUE_CONNECTION=sync).
          - |
            cat > .env <<'ENV'
            APP_NAME=Cutera
            APP_ENV=testing
            APP_KEY=
            APP_DEBUG=true
            APP_URL=http://localhost
            LOG_CHANNEL=stderr
            DB_CONNECTION=mariadb
            DB_HOST=127.0.0.1
            DB_PORT=3306
            DB_DATABASE=cutera_test
            DB_USERNAME=root
            DB_PASSWORD=password
            DB_TEST_HOST=127.0.0.1
            DB_TEST_PORT=3306
            DB_TEST_DATABASE=cutera_test
            DB_TEST_USERNAME=root
            DB_TEST_PASSWORD=password
            CACHE_STORE=file
            QUEUE_CONNECTION=sync
            SESSION_DRIVER=array
            MAIL_MAILER=array
            ENV
          - php artisan key:generate
          - for i in $(seq 1 30); do mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent && break; echo "waiting for mariadb ($i/30)"; sleep 2; done
          # Baseline schema snapshot (present on backend/api; cherry-pick onto crm2/production - see docs).
          - |
            if [ -f database/schema/mariadb_testing-schema.sql ]; then
              mysql -h 127.0.0.1 -uroot -ppassword cutera_test < database/schema/mariadb_testing-schema.sql
            else
              echo "WARNING: schema dump missing on this branch; building test DB from migrations only"
            fi
          - php artisan migrate --database=mariadb_testing --force
          - php artisan test --colors=always

    # ---------- Test-sync gates: missing-test + stale sweep (no coverage driver) ----------
    # Lightweight (git + bash only). Wired to dev/integration branches + PRs, NOT to
    # the live api/crm2 deploy branches (those must never be blocked by a sync check).
    - step: &gates
        name: 'Test-sync + guidelines gates'
        script:
          - apt-get update && apt-get install -y --no-install-recommends git > /dev/null
          - bash scripts/test-stale-sweep.sh
          - git fetch --no-tags --depth=200 origin backend production || git fetch --no-tags origin backend production || true
          - |
            BASE=$(git merge-base HEAD origin/backend 2>/dev/null || git merge-base HEAD origin/production 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo HEAD)
            echo "gate base = $BASE"
            bash scripts/test-sync-check.sh "$BASE"
            bash scripts/guidelines-check.sh "$BASE"     # GUIDELINES.md machine-checkable PHP rules

    # ---------- Quality: diff-coverage + mutation (Infection) ----------
    # MANUAL + tolerant (|| true) while we CALIBRATE: the first run reports the real
    # mutation score / diff-coverage so we can set infection.json5 thresholds. Once
    # calibrated: remove the `|| true`, drop `trigger: manual`, and add `*quality`
    # to the branch pipelines to make it GATING. Needs a coverage driver -> pcov.
    - step: &quality
        name: 'Quality: diff-cover + mutation (manual; calibrate then gate)'
        trigger: manual
        caches: [composer]
        services: [mariadb]
        script:
          - apt-get update && apt-get install -y --no-install-recommends git unzip libzip-dev libpng-dev libonig-dev default-mysql-client python3-pip > /dev/null
          - docker-php-ext-install pdo_mysql zip gd bcmath > /dev/null
          - pecl install pcov > /dev/null && docker-php-ext-enable pcov
          - pip3 install --quiet --break-system-packages diff-cover || pip3 install --quiet diff-cover || true
          - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          - composer install --no-interaction --prefer-dist --no-progress
          - |
            cat > .env <<'ENV'
            APP_NAME=Cutera
            APP_ENV=testing
            APP_KEY=
            APP_DEBUG=true
            APP_URL=http://localhost
            LOG_CHANNEL=stderr
            DB_CONNECTION=mariadb
            DB_HOST=127.0.0.1
            DB_PORT=3306
            DB_DATABASE=cutera_test
            DB_USERNAME=root
            DB_PASSWORD=password
            DB_TEST_HOST=127.0.0.1
            DB_TEST_PORT=3306
            DB_TEST_DATABASE=cutera_test
            DB_TEST_USERNAME=root
            DB_TEST_PASSWORD=password
            CACHE_STORE=file
            QUEUE_CONNECTION=sync
            SESSION_DRIVER=array
            MAIL_MAILER=array
            ENV
          - php artisan key:generate
          - for i in $(seq 1 30); do mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent && break; echo "waiting for mariadb ($i/30)"; sleep 2; done
          - |
            if [ -f database/schema/mariadb_testing-schema.sql ]; then
              mysql -h 127.0.0.1 -uroot -ppassword cutera_test < database/schema/mariadb_testing-schema.sql
            else
              echo "WARNING: schema dump missing; building test DB from migrations only"
            fi
          - php artisan migrate --database=mariadb_testing --force
          - git fetch --no-tags --depth=200 origin backend || true
          - composer test:diff-cover || true   # changed lines covered (calibrate, then make strict)
          - composer test:mutation  || true   # Infection on critical modules (calibrate minCoveredMsi, then strict)

    # ---------- Deploy over SSH (assets are committed -> no npm build) ----------
    - step: &deploy
        name: Deploy (SSH)
        clone: { enabled: false }
        script:
          - pipe: atlassian/ssh-run:0.8.1
            variables:
              SSH_USER: $DEPLOY_SSH_USER
              SERVER: $DEPLOY_SSH_HOST
              MODE: 'command'
              COMMAND: >
                set -e;
                cd "$DEPLOY_PATH";
                git fetch origin "$BITBUCKET_BRANCH";
                git reset --hard "origin/$BITBUCKET_BRANCH";
                composer install --no-dev --optimize-autoloader --no-interaction --no-progress;
                php artisan optimize:clear;
                php artisan view:cache;
                php artisan queue:restart

    # ---------- Manual migrate for LIVE shared-DB branches (api, crm2) ----------
    - step: &migrate-live
        name: 'MIGRATE live shared DB (manual)'
        trigger: manual
        clone: { enabled: false }
        script:
          - echo ">>> Run scripts/coexistence-check.sh LOCALLY (must PASS) before triggering this."
          - pipe: atlassian/ssh-run:0.8.1
            variables:
              SSH_USER: $DEPLOY_SSH_USER
              SERVER: $DEPLOY_SSH_HOST
              MODE: 'command'
              COMMAND: >
                set -e;
                cd "$DEPLOY_PATH";
                php artisan migrate --force

pipelines:
  branches:
    # === LIVE: api.cutera.pk — shares DB with crm2 -> manual migrate ===
    api:
      - step: *ci
      - step: { <<: *deploy, deployment: api }
      - step: { <<: *migrate-live, deployment: api }

    # === LIVE: crm2.cutera.pk — shares DB with api -> manual migrate ===
    crm2:
      - step: *ci
      - step: { <<: *deploy, deployment: crm2 }
      - step: { <<: *migrate-live, deployment: crm2 }

    # === Integration / release branch: VERIFY ONLY (no pipeline deploy). ===
    #   staging.cutera.pk was retired, so the old `deployment: staging` deploy +
    #   auto-migrate steps targeted a dead environment (they'd only redden the
    #   pipeline). The real backend deploy is the MANUAL `git push local backend
    #   -> server` over SSH (the server can't pull from Bitbucket) — never via
    #   this pipeline. So `backend` runs ci + gates, plus the manual quality gate.
    backend:
      - step: *ci
      - step: *gates
      # Manual quality gate (diff-cover + mutation). Trigger to calibrate, then
      # promote to a gating step (see &quality note).
      - step: *quality

    # === Integration / dev branches: test only, never deploy ===
    production: [ { step: *ci }, { step: *gates } ]
    gulraiz:    [ { step: *ci }, { step: *gates } ]
    shahid:     [ { step: *ci }, { step: *gates } ]

  pull-requests:
    '**':
      - step: *ci
      - step: *gates
